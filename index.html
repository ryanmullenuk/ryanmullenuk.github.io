<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Redhead Games</title>
  <meta name="description" content="Free browser games from Redhead Games: Noir Market and Aztlan Isle." />
  <meta name="theme-color" content="#0b0a0d" />
  <link rel="icon" type="image/png" href="img/apple-touch-icon.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <meta property="og:title" content="Redhead Games" />
  <meta property="og:description" content="Play Noir Market and Aztlan Isle free in your browser." />
  <meta property="og:image" content="https://redhead.games/img/logo.png" />
  <style>
    :root { --bg: #0b0a0d; --ink: #f4f1f6; --muted: #a39cab; --red: #e3141c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { min-height: 100svh; display: flex; flex-direction: column; align-items: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 50% 0%, rgba(227, 20, 28, 0.16), transparent 60%), var(--bg); }
    header { text-align: center; margin: 2vh 0 4vh; }
    header img { width: min(210px, 50vw); height: auto; display: block; margin: 0 auto; mix-blend-mode: lighten; }
    header p { margin: 4px 0 0; color: var(--muted); letter-spacing: 0.06em; }
    main { width: 100%; max-width: 860px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(14px, 3vw, 32px); }
    .tile { display: block; text-decoration: none; color: inherit; border-radius: 22px; outline: none;
      transition: transform 0.18s ease; -webkit-tap-highlight-color: transparent; }
    .art { position: relative; aspect-ratio: 1 / 1; border-radius: 22px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08); transition: box-shadow 0.18s ease; }
    .art img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .art::after { content: "PLAY"; position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%);
      background: var(--red); color: #fff; font-weight: 800; letter-spacing: 0.14em; font-size: clamp(12px, 2.2vw, 16px);
      padding: 0.55em 1.6em; border-radius: 999px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5); opacity: 0.92; }
    .tile:hover, .tile:focus-visible { transform: translateY(-4px); }
    .tile:hover .art, .tile:focus-visible .art { box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 3px var(--red); }
    .tile:hover .art img { transform: scale(1.04); }
    .tile:active { transform: scale(0.98); }
    .name { margin: 14px 4px 2px; font-size: clamp(17px, 2.6vw, 22px); font-weight: 800; text-align: center; }
    .tag { margin: 0 4px; color: var(--muted); font-size: clamp(12px, 1.8vw, 15px); text-align: center; line-height: 1.4; }
    footer { margin-top: auto; padding-top: 6vh; color: #6d6674; font-size: 13px; }
    @media (max-width: 380px) { main { gap: 12px; } .tag { display: none; } }
  </style>
</head>
<body>
  <header>
    <img src="img/logo.png" alt="Redhead Games" width="400" height="400" />
    <p>Choose a game</p>
  </header>
  <main>
    <a class="tile" href="/noir-market/" aria-label="Play Noir Market">
      <div class="art"><img src="img/noir-tile.jpg" alt="" width="512" height="512" /></div>
      <div class="name">Noir Market</div>
      <p class="tag">Move quietly. Trade fast. Survive the market.</p>
    </a>
    <a class="tile" href="/aztlan-isle/" aria-label="Play Aztlan Isle">
      <div class="art"><img src="img/aztlan-tile.jpg?v=3" alt="" width="640" height="640" /></div>
      <div class="name">Aztlan Isle</div>
      <p class="tag">Guide your people. Shape their world.</p>
    </a>
  </main>
  <footer>© Redhead Games</footer>
</body>
</html>
